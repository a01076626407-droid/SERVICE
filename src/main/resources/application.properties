spring.application.name=demo
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 💡 내비게이션 목적지를 멘티님의 DB 서버(192.168.40.20)로 수정했습니다.
spring.datasource.url=jdbc:mysql://localhost:3306/shelter_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true

# MySQL(MariaDB) 최고 관리자 계정
spring.datasource.username=root

# 💡 DB 설치 시 설정한 진짜 비밀번호가 맞는지 꼭 확인하세요!
spring.datasource.password=root

# JPA 설정 (엔티티를 바탕으로 테이블 자동 생성 및 SQL 로그 출력)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

