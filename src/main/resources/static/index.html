<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>대피할지도 - 재난 안전 대피소 통합 플랫폼</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen flex flex-col">

<!-- 헤더 구역 -->
<header class="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 h-16 relative flex items-center justify-between">
        <div class="flex items-center gap-2.5 shrink-0 cursor-pointer z-10" onclick="location.reload()">
            <div class="w-9 h-9 bg-blue-600 rounded-lg flex items-center justify-center text-white text-lg shadow-sm">
                <i class="fa-solid fa-shield-halved"></i>
            </div>
            <span class="text-base font-bold text-slate-900">대피할지도</span>
        </div>
        <div class="absolute left-1/2 -translate-x-1/2 w-full max-w-md px-4">
            <div class="relative flex items-center">
                <i class="fa-solid fa-magnifying-glass absolute left-3 text-slate-400 text-sm"></i>
                <input type="text" id="searchInput"
                       placeholder="장소, 건물명 또는 주소 검색 (예: 신림, 종로경찰서)"
                       class="w-full bg-slate-100 text-sm rounded-lg pl-9 pr-24 py-2 border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition"
                       onkeypress="if(event.key === 'Enter') executeSearch()">
                <button onclick="getUserLocation()" title="내 위치 중심으로 찾기"
                        class="absolute right-14 p-1.5 text-blue-600 hover:text-blue-700 hover:bg-blue-50 rounded-md transition flex items-center justify-center">
                    <i class="fa-solid fa-crosshairs text-base"></i>
                </button>
                <button onclick="executeSearch()"
                        class="absolute right-1.5 px-3 py-1 bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold rounded-md transition shadow-sm">
                    검색
                </button>
            </div>
        </div>
        <div class="w-9 shrink-0"></div>
    </div>
</header>

<!-- 메인 본문 구역 -->
<main class="max-w-7xl mx-auto px-4 py-6 flex-1 w-full space-y-5">
    <div id="disasterTabsArea" class="flex flex-wrap items-center justify-center gap-3"></div>
    <div class="grid grid-cols-1 lg:grid-cols-4 gap-4 mt-5">
        <div class="lg:col-span-1 bg-white rounded-2xl border border-slate-200 p-4 shadow-sm flex flex-col h-[650px]">
            <div class="flex items-center justify-between pb-2 border-b border-slate-100 mb-3">
                <h2 class="font-bold text-slate-800 text-sm" id="panelHeader">📊 대피소 목록</h2>
                <span id="totalCountBadge" class="text-xs text-blue-600 font-semibold bg-blue-50 px-2 py-0.5 rounded-full">0개</span>
            </div>
            <div id="resultsList" class="space-y-3 overflow-y-auto pr-1 flex-1"></div>
            <div id="paginationArea" class="pt-3 border-t border-slate-100 flex items-center justify-center gap-1.5 shrink-0"></div>
        </div>
        <div class="lg:col-span-3 bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden h-[650px]">
            <iframe id="mapFrame" src="/map" class="w-full h-full border-0"></iframe>
        </div>
    </div>
</main>

<script>
    let activeTabs = [];
    let currentType = '';
    let currentBounds = null;
    let currentSearchKeyword = '';
    let currentPage = 1;
    const itemsPerPage = 10;
    let currentDisplayList = [];
    let isInitialized = false;

    window.addEventListener('DOMContentLoaded', () => {
        console.log("🚀 [DEBUG] DOMContentLoaded 이벤트 발생, 초기화 시작");
        initDisasterTabs();
    });

    function getDistanceInMeters(lat1, lon1, lat2, lon2) {
        if (!lat1 || !lon1 || !lat2 || !lon2) return 999999;
        const R = 6371000;
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
            Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
            Math.sin(dLon / 2) * Math.sin(dLon / 2);
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        return Math.round(R * c);
    }

    function formatDistance(meters) {
        if (meters === undefined || isNaN(meters)) return '';
        if (meters >= 999999) return '';
        if (meters < 1000) return `${meters}m`;
        return `${(meters / 1000).toFixed(1)}km`;
    }

    async function initDisasterTabs() {
        if (isInitialized) return;
        isInitialized = true;

        try {
            console.log("📡 [DEBUG] /api/disaster-tabs/active 호출 중...");
            const response = await fetch('/api/disaster-tabs/active');
            if (!response.ok) throw new Error("API 통신 실패");
            const data = await response.json();
            console.log("✅ [DEBUG] 탭 데이터 수신 성공:", data);

            // 💡 [핵심 보완] 받아온 데이터가 없거나 배열이 아니면 예외를 발생시켜 기본 탭을 쓰도록 유도합니다.
            if (!Array.isArray(data) || data.length === 0) {
                throw new Error("활성화된 탭 데이터가 비어 있습니다.");
            }

            const apiMap = { earthquake: '/api/shelters/earthquake', flood: '/api/shelters/flood', airstrike: '/api/shelters/air', air: '/api/shelters/air' };
            const iconMap = { earthquake: '🏢', flood: '🌊', airstrike: '💣', air: '💣' };

            activeTabs = data.map(tab => ({
                id: tab.id, tableName: tab.tableName, name: tab.name,
                icon: iconMap[tab.tableName] || '🚨', apiUrl: apiMap[tab.tableName] || `/api/shelters/${tab.tableName}`
            }));
        } catch (e) {
            console.warn("⚠️ [DEBUG] 기본 비상 탭을 강제 로드합니다:", e);
            activeTabs = [
                { id: 1, tableName: 'earthquake', name: '지진 대피소', icon: '🏢', apiUrl: '/api/shelters/earthquake' },
                { id: 2, tableName: 'airstrike', name: '공습 대피소', icon: '💣', apiUrl: '/api/shelters/air' },
                { id: 3, tableName: 'flood', name: '수해 시설', icon: '🌊', apiUrl: '/api/shelters/flood' }
            ];
        }
        renderDisasterTabs();
        
        if (activeTabs.length > 0) {
            switchDisaster(activeTabs[0].tableName);
        }

        // 기본 서울 영역 데이터 즉시 강제 호출
        console.log("🗺️ [DEBUG] 초기 서울 영역 데이터 요청 트리거");
        filterByBounds({
            minLat: 37.40, maxLat: 37.60,
            minLng: 126.90, maxLng: 127.15,
            centerLat: 37.4954, centerLng: 127.0333
        });
    }

    function renderDisasterTabs() {
        const container = document.getElementById('disasterTabsArea');
        if (!container) return;
        container.innerHTML = '';
        activeTabs.forEach(tab => {
            const btn = document.createElement('button');
            btn.id = `tab-${tab.tableName}`;
            btn.className = "flex-1 min-w-[140px] max-w-[240px] py-3 px-4 rounded-xl font-bold text-sm shadow-sm transition-all duration-200 tab-btn-inactive";
            btn.innerHTML = `${tab.icon} ${tab.name}`;
            btn.onclick = () => switchDisaster(tab.tableName);
            container.appendChild(btn);
        });
    }

    async function filterByBounds(bounds) {
        currentBounds = bounds;
        if (!currentType) {
            console.warn("⚠️ [DEBUG] currentType이 지정되지 않아 데이터 요청을 건너뜁니다.");
            return;
        }

        const currentTabObj = activeTabs.find(t => t.tableName === currentType);
        if (!currentTabObj) {
            console.warn("⚠️ [DEBUG] 일치하는 탭 객체를 찾을 수 없습니다:", currentType);
            return;
        }

        const queryParams = `minLat=${bounds.minLat}&maxLat=${bounds.maxLat}&minLng=${bounds.minLng}&maxLng=${bounds.maxLng}`;
        const targetUrl = `${currentTabObj.apiUrl}?${queryParams}`;
        console.log(`🔍 [DEBUG] 대피소 데이터 요청 URL: ${targetUrl}`);

        try {
            const response = await fetch(targetUrl);
            if (!response.ok) throw new Error(`HTTP 상태 코드 에러: ${response.status}`);
            const dbData = await response.json();
            console.log(`✨ [DEBUG] 대피소 데이터 수신 완료 (${dbData.length}건)`);

            if (!Array.isArray(dbData)) return;

            const centerLat = bounds.centerLat || ((bounds.minLat + bounds.maxLat) / 2);
            const centerLng = bounds.centerLng || ((bounds.minLng + bounds.maxLng) / 2);

            let parsedList = dbData.map(item => {
                let rawLat = Number(item.lat ?? item.la ?? item.latitude ?? item.y ?? 0);
                let rawLng = Number(item.lot ?? item.lng ?? item.lo ?? item.longitude ?? item.x ?? 0);

                let realLat = (rawLat >= 33 && rawLat <= 43) ? rawLat : ((rawLng >= 33 && rawLng <= 43) ? rawLng : null);
                let realLng = (rawLng >= 120 && rawLng <= 135) ? rawLng : ((rawLat >= 120 && rawLng <= 135) ? rawLat : null);

                const name = item.fclt_nm || item.vt_acm_dfclls_nm || item.equp_name || item.shelterName || item.shltNm || item.name || '대피소';
                const address = item.daddr || item.rn_addr || item.lnm_addr || item.address || item.rdnmadr || '주소 정보 없음';
                const distance = (realLat && realLng) ? getDistanceInMeters(centerLat, centerLng, realLat, realLng) : 999999;

                return {
                    id: item.shltId || item.shlt_id || item.id || item.seq || item.mngNo,
                    name: name, address: address, lat: realLat, lng: realLng, distance: distance,
                    isAdmin: String(item.shltId || item.shlt_id || '').startsWith('USER_') || Number(item.shlt_id) > 20000
                };
            });

            parsedList.sort((a, b) => {
                if (a.isAdmin && !b.isAdmin) return -1;
                if (!a.isAdmin && b.isAdmin) return 1;
                return a.distance - b.distance;
            });

            currentDisplayList = parsedList;
            currentPage = 1;

            const badge = document.getElementById('totalCountBadge');
            if (badge) badge.innerText = `화면 내 ${currentDisplayList.length}개`;

            updateMapWithFrame(currentDisplayList);
            renderCurrentPage();

        } catch (error) {
            console.error(`❌ [${currentType}] 영역별 데이터 수신 실패:`, error);
        }
    }

    function switchDisaster(tableName) {
        currentType = tableName;
        console.log(`리스너 전환: ${tableName}`);
        activeTabs.forEach(tab => {
            const btn = document.getElementById(`tab-${tab.tableName}`);
            if (!btn) return;
            btn.className = `flex-1 min-w-[140px] max-w-[240px] py-3 px-4 rounded-xl font-bold text-sm shadow-sm transition-all duration-200 ${tab.tableName === tableName ? 'tab-btn-active' : 'tab-btn-inactive'}`;
        });
        const selected = activeTabs.find(t => t.tableName === tableName);
        const headerElement = document.getElementById('panelHeader');
        if (headerElement && selected) headerElement.innerText = `📊 ${selected.icon} ${selected.name} 목록`;

        const searchInput = document.getElementById('searchInput');
        if (searchInput) searchInput.value = '';
        currentSearchKeyword = '';
        if (currentBounds) filterByBounds(currentBounds);
    }

    function executeSearch() {
        const keyword = document.getElementById('searchInput').value.trim();
        currentSearchKeyword = keyword;

        if (keyword === '') {
            if (currentBounds) filterByBounds(currentBounds);
            return;
        }

        const frame = document.getElementById('mapFrame');
        if (frame && frame.contentWindow && typeof frame.contentWindow.searchPlace === 'function') {
            frame.contentWindow.searchPlace(keyword);
        }
    }

    function getUserLocation() {
        if (!navigator.geolocation) { alert("위치 정보(GPS)를 지원하지 않습니다."); return; }
        const badge = document.getElementById('totalCountBadge');
        if (badge) badge.innerText = "내 위치 찾는 중...";
        navigator.geolocation.getCurrentPosition(
            function (position) {
                const frame = document.getElementById('mapFrame');
                if (frame && frame.contentWindow && typeof frame.contentWindow.moveToUserLocation === 'function') {
                    frame.contentWindow.moveToUserLocation(position.coords.latitude, position.coords.longitude);
                }
            },
            function (error) {
                alert("위치 정보를 가져올 수 없습니다.");
                if (badge) badge.innerText = `화면 내 ${currentDisplayList.length}개`;
            },
            { enableHighAccuracy: true, timeout: 8000, maximumAge: 0 }
        );
    }

    function renderCurrentPage() {
        const listArea = document.getElementById('resultsList');
        const pageArea = document.getElementById('paginationArea');
        listArea.innerHTML = ''; pageArea.innerHTML = '';

        if (currentDisplayList.length === 0) {
            listArea.innerHTML = `<div class="p-6 text-center text-xs text-slate-400 leading-relaxed">대피소가 없습니다.</div>`;
            return;
        }

        const totalItems = currentDisplayList.length;
        const totalPages = Math.ceil(totalItems / itemsPerPage);
        const startIndex = (currentPage - 1) * itemsPerPage;
        const pagedItems = currentDisplayList.slice(startIndex, startIndex + itemsPerPage);

        pagedItems.forEach((shelter, idx) => {
            const itemNumber = startIndex + idx + 1;
            const card = document.createElement('div');
            card.className = "shelter-card";

            card.onclick = function () {
                if (shelter.lat && shelter.lng) {
                    const frame = document.getElementById('mapFrame');
                    if (frame && frame.contentWindow && typeof frame.contentWindow.panToLocation === 'function') {
                        frame.contentWindow.panToLocation(shelter.lat, shelter.lng);
                    }
                } else {
                    alert("위치(좌표) 정보가 등록되지 않아 지도로 이동할 수 없습니다.");
                }
            };

            const distBadge = (shelter.lat && shelter.lng)
                ? `<span style="display:inline-flex;align-items:center;font-size:11px;font-weight:700;color:#059669;background-color:#ecfdf5;border:1px solid #a7f3d0;padding:2px 8px;border-radius:9999px;">🚶 ${formatDistance(shelter.distance)}</span>`
                : `<span style="display:inline-flex;align-items:center;font-size:11px;font-weight:700;color:#dc2626;background-color:#fef2f2;border:1px solid #fecaca;padding:2px 8px;border-radius:9999px;">📍 위치 미등록</span>`;

            const adminBadge = shelter.isAdmin
                ? `<span style="font-size:10px;font-weight:700;color:#9333ea;background-color:#f3e8ff;padding:2px 6px;border-radius:4px;margin-left:4px;">✨ 신규 등록됨</span>`
                : '';

            card.innerHTML = `
                <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;">
                    <div>
                        <span style="font-size:10px;font-weight:700;color:#2563eb;background-color:#eff6ff;padding:2px 6px;border-radius:4px;">No.${itemNumber}</span>
                        ${adminBadge}
                    </div>
                    ${distBadge}
                </div>
                <h3 class="text-sm font-bold text-slate-900">${shelter.name}</h3>
                <p class="text-xs text-slate-500 mt-1">📍 ${shelter.address}</p>
            `;
            listArea.appendChild(card);
        });

        const pageGroupSize = 5;
        const currentGroup = Math.ceil(currentPage / pageGroupSize);
        const startPage = (currentGroup - 1) * pageGroupSize + 1;
        const endPage = Math.min(startPage + pageGroupSize - 1, totalPages);

        const prevBtn = document.createElement('button');
        prevBtn.innerHTML = '<i class="fa-solid fa-chevron-left text-[10px]"></i>';
        prevBtn.className = `page-btn ${currentPage === 1 ? 'page-btn-disabled' : 'page-btn-normal'}`;
        prevBtn.disabled = (currentPage === 1);
        prevBtn.onclick = () => { if (currentPage > 1) { currentPage--; renderCurrentPage(); } };
        pageArea.appendChild(prevBtn);

        for (let p = startPage; p <= endPage; p++) {
            const numBtn = document.createElement('button');
            numBtn.innerText = p;
            numBtn.className = `page-btn ${p === currentPage ? 'page-btn-active' : 'page-btn-normal'}`;
            numBtn.onclick = () => { currentPage = p; renderCurrentPage(); };
            pageArea.appendChild(numBtn);
        }

        const nextBtn = document.createElement('button');
        nextBtn.innerHTML = '<i class="fa-solid fa-chevron-right text-[10px]"></i>';
        nextBtn.className = `page-btn ${currentPage === totalPages ? 'page-btn-disabled' : 'page-btn-normal'}`;
        nextBtn.disabled = (currentPage === totalPages);
        nextBtn.onclick = () => { if (currentPage < totalPages) { currentPage++; renderCurrentPage(); } };
        pageArea.appendChild(nextBtn);
    }

    function selectShelterFromMap(selectedShelter) {
        const listArea = document.getElementById('resultsList');
        const pageArea = document.getElementById('paginationArea');
        const badge = document.getElementById('totalCountBadge');

        if (badge) badge.innerText = `선택된 대피소`;
        pageArea.innerHTML = '';

        const distHtml = (selectedShelter.distance && selectedShelter.distance < 999999)
            ? `<span style="font-size:12px;font-weight:700;color:#059669;">🚶 거리: ${formatDistance(selectedShelter.distance)}</span>`
            : `<span style="font-size:12px;font-weight:700;color:#dc2626;">📍 위치 정보 미등록</span>`;

        listArea.innerHTML = `
            <div class="mb-2">
                <button onclick="if(currentBounds) filterByBounds(currentBounds)"
                        class="w-full py-1.5 px-3 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold rounded-lg transition flex items-center justify-center gap-1.5">
                    <i class="fa-solid fa-arrow-rotate-left text-[10px]"></i> 전체 목록 다시보기
                </button>
            </div>
            <div class="shelter-card border-2 border-blue-500 bg-blue-50/50 shadow-sm p-3 rounded-xl">
                <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;">
                    <span class="bg-blue-600 text-white text-[10px] font-bold px-2 py-0.5 rounded-full">선택됨</span>
                    ${distHtml}
                </div>
                <h3 class="text-sm font-bold text-slate-900">${selectedShelter.name}</h3>
                <p class="text-xs text-slate-600 mt-1.5 leading-relaxed">🏢 주소: ${selectedShelter.address}</p>
                <div class="mt-3 pt-2 border-t border-blue-100 flex items-center justify-between text-[11px] text-slate-500">
                    <span>위도: ${selectedShelter.lat ? selectedShelter.lat.toFixed(4) : 'N/A'}</span>
                    <span>경도: ${selectedShelter.lng ? selectedShelter.lng.toFixed(4) : 'N/A'}</span>
                </div>
            </div>
        `;
    }

    function updateMapWithFrame(dataList) {
        const frame = document.getElementById('mapFrame');
        if (frame && frame.contentWindow && typeof frame.contentWindow.setMarkers === 'function') {
            frame.contentWindow.setMarkers(dataList);
        }
    }
</script>
</body>
</html>
